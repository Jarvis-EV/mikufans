<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>mikufans</title>
<style>
  :root {
    --primary: #007AFF;
    --primary-light: rgba(0, 122, 255, 0.1);
    --primary-dark: #0051D5;
    --bg: #F2F3F5;
    --card-bg: rgba(255, 255, 255, 0.6);
    --card-bg-solid: #ffffff;
    --text: #1c1c1e;
    --text-light: #8E8E93;
    --border: rgba(255, 255, 255, 0.5);
    --green: #34C759;
    --green-light: rgba(52, 199, 89, 0.12);
    --orange: #FF9500;
    --orange-light: rgba(255, 149, 0, 0.12);
    --gray: #8E8E93;
    --gray-light: rgba(142, 142, 147, 0.12);
    --red: #FF3B30;
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.12);
    --radius: 20px;
    --radius-sm: 14px;
    --blur: 30px;
  }

  /* 深色模式 */
  :root[data-theme="dark"] {
    --bg: #000000;
    --card-bg: rgba(28, 28, 30, 0.6);
    --card-bg-solid: #1c1c1e;
    --text: #f5f5f7;
    --text-light: #8E8E93;
    --border: rgba(255, 255, 255, 0.1);
    --green: #30D158;
    --green-light: rgba(48, 209, 88, 0.15);
    --orange: #FF9F0A;
    --orange-light: rgba(255, 159, 10, 0.15);
    --gray: #636366;
    --gray-light: rgba(118, 118, 128, 0.15);
    --red: #FF453A;
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  :root[data-theme="dark"] .bg-layer::after {
    background: rgba(0, 0, 0, var(--bg-opacity));
  }
  :root[data-theme="dark"] .topbar,
  :root[data-theme="dark"] .list-header {
    background: rgba(28, 28, 30, 0.5);
    border-bottom-color: rgba(255, 255, 255, 0.08);
  }
  :root[data-theme="dark"] .btn {
    background: rgba(44, 44, 46, 0.6);
    color: #f5f5f7;
  }
  :root[data-theme="dark"] .btn:hover { background: rgba(58, 58, 60, 0.8); }
  :root[data-theme="dark"] .search-input,
  :root[data-theme="dark"] .sort-select,
  :root[data-theme="dark"] .seg-group {
    background: rgba(44, 44, 46, 0.6);
  }
  :root[data-theme="dark"] .seg-btn { color: #8E8E93; }
  :root[data-theme="dark"] .seg-btn.active { background: #2c2c2e; color: #f5f5f7; }
  :root[data-theme="dark"] .stats-bar { background: rgba(10, 132, 255, 0.1); }
  :root[data-theme="dark"] .chart-bar,
  :root[data-theme="dark"] .filter-bar {
    background: rgba(28, 28, 30, 0.4);
    border-bottom-color: rgba(255, 255, 255, 0.06);
  }
  :root[data-theme="dark"] .modal {
    background: rgba(28, 28, 30, 0.85);
    border-color: rgba(255, 255, 255, 0.1);
  }
  :root[data-theme="dark"] .form-group input,
  :root[data-theme="dark"] .form-group textarea {
    background: rgba(44, 44, 46, 0.7);
    color: #f5f5f7;
  }
  :root[data-theme="dark"] .tag-type-goods { background: rgba(10, 132, 255, 0.2); color: #0A84FF; }
  :root[data-theme="dark"] .tag-type-book { background: rgba(48, 209, 88, 0.2); color: #30D158; }
  :root[data-theme="dark"] .tag-priority { background: rgba(255, 55, 95, 0.2); color: #FF375F; }
  :root[data-theme="dark"] .tag-ip { background: rgba(94, 92, 230, 0.2); color: #5E5CE6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-attachment: fixed;
  }
  /* 自定义背景图层 */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    --bg-opacity: 0.75;
    --bg-blur: 60px;
  }
  .bg-layer::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(var(--bg-tint, 242, 243, 245), var(--bg-opacity));
    backdrop-filter: blur(var(--bg-blur));
    -webkit-backdrop-filter: blur(var(--bg-blur));
  }

  /* ===== View 切换 ===== */
  .view { display: none; min-height: 100vh; }
  .view.active { display: block; }

  /* ===== 顶部栏 ===== */
  .topbar {
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 0.5px solid rgba(255, 255, 255, 0.5);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .topbar-actions { display: flex; gap: 8px; }
  .btn {
    padding: 8px 16px;
    border-radius: 100px;
    border: none;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(20px);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    transition: all 0.15s;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.9); }
  .btn-primary {
    background: var(--primary);
    color: white;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-danger {
    color: var(--red);
    background: rgba(255, 59, 48, 0.1);
  }
  .btn-danger:hover { background: rgba(255, 59, 48, 0.2); }

  /* ===== 首页漫展卡片 ===== */
  /* ===== 首页布局 ===== */
  .home-layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 24px;
    align-items: start;
  }
  .shelf-panel {
    background: var(--card-bg);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    position: sticky;
    top: 80px;
  }
  .shelf-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .shelf-header h3 { font-size: 15px; font-weight: 700; }
  .shelf-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 60vh;
    overflow-y: auto;
  }
  .book-item {
    display: flex;
    gap: 10px;
    padding: 10px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.4);
    cursor: pointer;
    transition: background 0.15s;
  }
  .book-item:hover { background: rgba(255, 255, 255, 0.7); }
  .book-thumb {
    width: 40px;
    height: 56px;
    border-radius: 4px;
    background: var(--gray-light);
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  .book-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .book-info { flex: 1; min-width: 0; }
  .book-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .book-meta { font-size: 11px; color: var(--text-light); }
  .book-price { font-size: 12px; font-weight: 600; color: var(--text); }

  .container { max-width: 1080px; margin: 0 auto; padding: 24px; }

  /* 收藏馆网格 */
  .theme-presets {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .theme-preset {
    cursor: pointer;
    text-align: center;
    border-radius: 12px;
    padding: 8px 4px;
    transition: background 0.15s;
  }
  .theme-preset:hover { background: rgba(255, 255, 255, 0.4); }
  .theme-preset-preview {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .theme-preset-name {
    font-size: 11px;
    color: var(--text-light);
  }
  .shelf-layout {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 24px;
    align-items: start;
  }
  .shelf-sidebar {
    position: sticky;
    top: 80px;
  }
  .shelf-sidebar h4 {
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 12px;
    font-weight: 600;
  }
  .shelf-ip-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .shelf-ip-tag {
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-light);
    transition: background 0.15s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .shelf-ip-tag:hover { background: rgba(255, 255, 255, 0.4); }
  .shelf-ip-tag.active {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 600;
  }
  .shelf-ip-count {
    font-size: 11px;
    opacity: 0.7;
  }
  .shelf-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }
  .book-card {
    background: var(--card-bg);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: var(--shadow);
  }
  .book-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
  }
  .book-card-cover {
    width: 100%;
    aspect-ratio: 3 / 4;
    border-radius: 8px;
    background: var(--gray-light);
    overflow: hidden;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  .book-card-cover img { width: 100%; height: 100%; object-fit: cover; }
  .book-card-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
  .book-card-meta { font-size: 11px; color: var(--text-light); line-height: 1.4; }
  .book-card-price { font-size: 13px; font-weight: 700; margin-top: 6px; }
  .event-list { display: flex; flex-direction: column; gap: 16px; }
  .event-card {
    background: var(--card-bg);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .event-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .event-card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .event-name { font-size: 18px; font-weight: 700; }
  .event-meta { color: var(--text-light); font-size: 14px; margin-bottom: 12px; }
  .event-meta span { margin-right: 12px; }
  .progress-bar {
    height: 6px;
    background: var(--gray-light);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 3px;
    transition: width 0.3s;
  }
  .event-stats { font-size: 13px; color: var(--text-light); }
  .event-stats strong { color: var(--text); }

  /* 状态标签 */
  .tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
  }
  .tag-upcoming { background: var(--primary-light); color: var(--primary-dark); }
  .tag-ongoing { background: var(--green-light); color: var(--green); }
  .tag-past { background: var(--gray-light); color: var(--gray); }

  /* ===== 年历 ===== */
  .calendar-card {
    background: var(--card-bg);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
  }
  .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .calendar-header h3 { font-size: 16px; }
  .cal-nav {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 32px;
    height: 32px;
    font-size: 18px;
    cursor: pointer;
    color: var(--text);
  }
  .cal-nav:hover { background: var(--gray-light); }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    text-align: center;
    font-size: 13px;
  }
  .cal-weekday {
    color: var(--text-light);
    font-weight: 600;
    padding: 4px 0;
    font-size: 12px;
  }
  .cal-day {
    padding: 8px 0;
    border-radius: 6px;
    cursor: default;
    color: var(--text);
    position: relative;
  }
  .cal-day.other-month { color: #d1d5db; }
  .cal-day.today { background: var(--primary-light); font-weight: 600; }
  .cal-day.has-event {
    background: var(--primary);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  .cal-day.has-event:hover { background: var(--primary-dark); }
  .cal-event-tip {
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    white-space: nowrap;
  }

  /* ===== 悬浮按钮 ===== */  .fab {
    position: fixed;
    bottom: 32px;
    right: 32px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    border: none;
    font-size: 28px;
    cursor: pointer;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s;
    z-index: 20;
  }
  .fab:hover { transform: scale(1.08); }

  /* ===== 空状态 ===== */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-light);
    font-size: 15px;
  }

  /* ===== 清单页 ===== */
  .list-header {
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 0.5px solid rgba(255, 255, 255, 0.5);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .list-header h2 { font-size: 20px; font-weight: 700; flex: 1; letter-spacing: -0.3px; }
  .back-btn {
    background: none;
    border: none;
    font-size: 16px;
    cursor: pointer;
    color: var(--primary);
    padding: 4px 8px;
    font-weight: 500;
  }

  .stats-bar {
    background: rgba(0, 122, 255, 0.06);
    backdrop-filter: blur(20px);
    padding: 16px 24px;
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    font-size: 14px;
  }
  .stats-bar .stat-item { color: var(--text); }
  .stats-bar .stat-item strong { font-size: 17px; font-weight: 700; }

  /* ===== 饼图 ===== */
  .chart-bar {
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(20px);
    padding: 20px 24px;
    border-bottom: 0.5px solid rgba(255, 255, 255, 0.3);
  }
  .chart-container {
    max-width: 600px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .pie-chart {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .chart-legend {
    flex: 1;
    min-width: 200px;
    font-size: 13px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .legend-name { flex: 1; }
  .legend-value { color: var(--text-light); font-weight: 500; }

  .filter-bar {
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(20px);
    padding: 12px 24px;
    display: flex;
    gap: 12px;
    align-items: center;
    border-bottom: 0.5px solid rgba(255, 255, 255, 0.3);
    flex-wrap: wrap;
  }
  .search-input {
    flex: 1;
    min-width: 200px;
    padding: 10px 16px;
    border: none;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(20px);
    font-size: 14px;
    color: var(--text);
  }
  .search-input::placeholder { color: var(--text-light); }
  .seg-group {
    display: flex;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(20px);
    border-radius: 100px;
    padding: 2px;
  }
  .seg-btn {
    padding: 6px 16px;
    border: none;
    background: transparent;
    border-radius: 100px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-light);
    transition: all 0.15s;
  }
  .seg-btn.active { background: white; color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .sort-select {
    padding: 8px 16px;
    border: none;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(20px);
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
  }

  /* ===== 物品卡片 ===== */
  .item-list { padding: 24px; max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .item-tab-bar { display: flex; gap: 8px; }
  .item-tab {
    padding: 8px 20px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    backdrop-filter: blur(var(--blur));
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-light);
    transition: all 0.15s;
  }
  .item-tab.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .item-column h3 { font-size: 14px; color: var(--text-light); margin-bottom: 12px; font-weight: 600; padding-left: 4px; }
  .item-column .cards { display: flex; flex-direction: column; gap: 12px; }
  .item-column.done h3 { color: var(--green); }
  .item-card {
    background: var(--card-bg);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 16px;
    align-items: center;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .item-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .item-thumb {
    width: 64px;
    height: 64px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .item-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .item-main { flex: 1; min-width: 0; }
  .item-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .item-meta { font-size: 12px; color: var(--text-light); }
  .item-right { text-align: right; flex-shrink: 0; }
  .item-price { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .item-tags { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }

  /* 标签颜色 */
  .tag-priority { background: rgba(255, 45, 85, 0.12); color: #FF2D55; }
  .tag-ip { background: rgba(88, 86, 214, 0.12); color: #5856D6; }
  .tag-type-goods { background: rgba(0, 122, 255, 0.12); color: #007AFF; margin-right: 6px; }
  .tag-type-book { background: rgba(52, 199, 89, 0.12); color: #34C759; margin-right: 6px; }
  .tag-type-free { background: rgba(255, 149, 0, 0.12); color: #FF9500; margin-right: 6px; }
  .tag-status-bought { background: var(--green-light); color: var(--green); }
  .tag-status-queue { background: var(--orange-light); color: var(--orange); }
  .tag-status-soldout { background: var(--gray-light); color: var(--gray); }
  .tag-status-drop { background: rgba(255, 59, 48, 0.12); color: var(--red); text-decoration: line-through; }

  /* ===== 弹窗 ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border: 0.5px solid rgba(255, 255, 255, 0.6);
    border-radius: 24px;
    width: 90%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 28px;
    box-shadow: var(--shadow-lg);
    animation: modalIn 0.2s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 20px; letter-spacing: -0.3px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; color: var(--text-light); margin-bottom: 8px; font-weight: 500; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%;
    padding: 12px 16px;
    border: none;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(20px);
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
  }
  .form-group input:focus, .form-group textarea:focus { outline: 2px solid var(--primary-light); }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }

  .type-switch { display: flex; gap: 8px; margin-bottom: 14px; }
  .type-btn {
    flex: 1;
    padding: 12px;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
  }
  .type-btn.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary-dark); }

  .tag-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-option {
    padding: 4px 12px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    cursor: pointer;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .tag-option.active { background: var(--primary); color: white; border-color: var(--primary); }
  .tag-del { font-size: 14px; opacity: 0.6; margin-left: 2px; }
  .tag-del:hover { opacity: 1; }
  .tag-add { border-style: dashed; color: var(--primary-dark); }

  .image-upload {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    color: var(--text-light);
    font-size: 13px;
  }
  .image-upload:hover { border-color: var(--primary); }
  .image-preview {
    margin-top: 10px;
    text-align: center;
  }
  .image-preview img {
    max-width: 100%;
    max-height: 200px;
    border-radius: 8px;
  }

  .modal-actions {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .modal-actions-right { display: flex; gap: 8px; }

  /* ===== 手机端适配 ===== */
  @media (max-width: 768px) {
    .home-layout {
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .shelf-panel {
      position: static;
      order: 2;
    }
    .main-panel { order: 1; }
    .container { padding: 16px; }
    .topbar { padding: 12px 16px; }
    .topbar h1 { font-size: 18px; }
    .event-card { padding: 16px; }
    .calendar-card { padding: 16px; }
    .item-list {
      grid-template-columns: 1fr;
      padding: 16px;
      gap: 16px;
    }
    .list-header { padding: 12px 16px; }
    .list-header h2 { font-size: 17px; }
    .stats-bar { padding: 12px 16px; gap: 16px; font-size: 13px; }
    .stats-bar .stat-item strong { font-size: 15px; }
    .filter-bar { padding: 10px 16px; gap: 8px; }
    .search-input { min-width: 100%; }
    .modal { padding: 20px; border-radius: 20px; }
    .fab { width: 48px; height: 48px; font-size: 24px; bottom: 20px; right: 20px; }
    .shelf-list { max-height: none; }
    .chart-container { flex-direction: column; }
    .pie-chart { width: 120px; height: 120px; }
    .form-row { flex-direction: column; gap: 0; }
  }
</style>
</head>
<body>

<div class="bg-layer" id="bg-layer"></div>

<!-- 首页 -->
<div id="view-home" class="view active">
  <div class="topbar">
    <h1>mikufans</h1>
    <div class="topbar-actions">
      <button class="btn btn-primary" onclick="showView('shelf')">收藏馆</button>
      <button class="btn" onclick="openBgPicker()" title="设置背景图">🎨</button>
      <button class="btn" onclick="handleImport()">导入</button>
      <button class="btn" onclick="handleExport()">导出</button>
    </div>
  </div>
  <div class="container">
    <div class="calendar-card" id="calendar-card">
      <div class="calendar-header">
        <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
        <h3 id="calendar-title">2026年11月</h3>
        <button class="cal-nav" onclick="changeMonth(1)">›</button>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </div>
    <div id="event-list" class="event-list" style="margin-top:20px"></div>
    <div id="empty-state" class="empty-state" style="display:none">
      还没有漫展，点右下角加一个
    </div>
  </div>
  <button class="fab" onclick="openEventModal()">+</button>
</div>

<!-- 收藏馆页 -->
<div id="view-shelf" class="view">
  <div class="topbar">
    <button class="btn" onclick="showView('home')">← 返回</button>
    <h1>收藏馆</h1>
    <button class="btn btn-primary" onclick="openBookModal()">+ 录入</button>
  </div>
  <div class="container shelf-layout">
    <div class="shelf-sidebar">
      <h4>IP 分类</h4>
      <div id="shelf-ip-list" class="shelf-ip-list"></div>
    </div>
    <div class="shelf-main">
      <div id="shelf-stats" class="stats-bar" style="margin-bottom:20px"></div>
      <div id="shelf-grid" class="shelf-grid"></div>
      <div id="shelf-empty" class="empty-state" style="display:none">
        还没有收藏的本子，点右上角录入第一本吧
      </div>
    </div>
  </div>
  <button class="fab" onclick="openBookModal()">+</button>
</div>

<!-- 清单页 -->
<div id="view-list" class="view">
  <div class="list-header">
    <button class="back-btn" onclick="goHome()">← 返回</button>
    <h2 id="list-title">漫展清单</h2>
    <button class="btn" id="map-btn" style="display:none" onclick="openMapViewer()">🗺️ 场地图</button>
    <button class="btn" onclick="openEventModal(currentEventId)">编辑</button>
  </div>
  <div class="stats-bar" id="stats-bar"></div>
  <div class="chart-bar" id="chart-bar" style="display:none">
    <div class="chart-container">
      <div class="pie-chart" id="pie-chart"></div>
      <div class="chart-legend" id="chart-legend"></div>
    </div>
  </div>
  <div class="filter-bar">
    <input type="text" class="search-input" id="search-input" placeholder="搜物品名..." oninput="renderItems()">
    <div class="seg-group">
      <button class="seg-btn active" data-type="all" onclick="setTypeFilter('all')">全部</button>
      <button class="seg-btn" data-type="goods" onclick="setTypeFilter('goods')">谷</button>
      <button class="seg-btn" data-type="book" onclick="setTypeFilter('book')">本</button>
      <button class="seg-btn" data-type="free" onclick="setTypeFilter('free')">无料</button>
    </div>
    <select class="sort-select" id="sort-select" onchange="renderItems()">
      <option value="venue">按场馆摊位</option>
      <option value="priority">按优先级</option>
      <option value="created">按添加时间</option>
    </select>
  </div>
  <div class="item-list" id="item-list"></div>
  <div id="item-empty" class="empty-state" style="display:none">
    还没有物品，点右下角加一件
  </div>
  <button class="fab" onclick="openItemModal()">+</button>
</div>

<!-- 漫展编辑弹窗 -->
<div class="modal-overlay" id="modal-event">
  <div class="modal">
    <h3 id="event-modal-title">新建漫展</h3>
    <div class="form-group">
      <label>漫展名称</label>
      <input type="text" id="event-name" placeholder="如 CP30">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>开始日期</label>
        <input type="date" id="event-start">
      </div>
      <div class="form-group">
        <label>结束日期</label>
        <input type="date" id="event-end">
      </div>
    </div>
    <div class="form-group">
      <label>地点</label>
      <input type="text" id="event-location" placeholder="如 国家会展中心（上海）">
    </div>
    <div class="form-group">
      <label>场地图（可选，可上传多张）</label>
      <div class="image-upload" onclick="document.getElementById('map-input').click()">
        点击上传场地图（场馆分布图，可多张）
      </div>
      <input type="file" id="map-input" accept="image/*" multiple style="display:none" onchange="handleMapUpload(event)">
      <div id="map-list" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="event-delete-btn" style="display:none" onclick="deleteCurrentEvent()">删除</button>
      <div class="modal-actions-right">
        <button class="btn" onclick="closeModal('modal-event')">取消</button>
        <button class="btn btn-primary" onclick="saveEvent()">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- 物品编辑弹窗 -->
<div class="modal-overlay" id="modal-item">
  <div class="modal">
    <h3 id="item-modal-title">新增物品</h3>
    <div class="type-switch">
      <button class="type-btn active" data-type="goods" onclick="setItemType('goods')">谷</button>
      <button class="type-btn" data-type="book" onclick="setItemType('book')">本</button>
      <button class="type-btn" data-type="free" onclick="setItemType('free')">无料</button>
    </div>
    <div class="form-group">
      <label>物品名称</label>
      <input type="text" id="item-name" placeholder="如 某某徽章">
    </div>
    <div class="form-group">
      <label>IP / 作品 <span style="font-weight:normal;color:var(--text-light)">（如 咒术回战 / 初音未来）</span></label>
      <input type="text" id="item-ip" placeholder="如 咒术回战">
    </div>
    <div class="form-group">
      <label>商品图</label>
      <div class="image-upload" id="image-upload" onclick="document.getElementById('image-input').click()">
        点击上传商品图（截图、官图）
      </div>
      <input type="file" id="image-input" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
      <div class="image-preview" id="image-preview" style="display:none">
        <img id="image-preview-img" src="">
        <button class="btn" style="margin-top:8px" onclick="removeImage()">移除图片</button>
      </div>
    </div>
    <div class="form-row" id="price-row">
      <div class="form-group">
        <label>价格（元）</label>
        <input type="number" id="item-price" min="0" step="0.01" placeholder="0">
      </div>
      <div class="form-group">
        <label>场馆</label>
        <input type="text" id="item-venue" placeholder="如 H1馆">
      </div>
      <div class="form-group">
        <label>摊位号</label>
        <input type="text" id="item-booth" placeholder="如 A12">
      </div>
    </div>
    <div class="form-group" id="sale-group">
      <label>贩售情况 <span style="font-weight:normal;color:var(--text-light)">（点选，或在下方输入自定义）</span></label>
      <div class="tag-picker" id="sale-picker"></div>
      <input type="text" id="sale-custom" placeholder="或自定义输入" style="margin-top:8px" oninput="syncSale(this.value)">
    </div>
    <div class="form-group">
      <label>优先级标签 <span style="font-weight:normal;color:var(--text-light)">（点选，或在下方输入自定义）</span></label>
      <div class="tag-picker" id="priority-picker"></div>
      <input type="text" id="priority-custom" placeholder="或自定义输入" style="margin-top:8px" oninput="syncPriority(this.value)">
    </div>
    <div class="form-group">
      <label>状态标签 <span style="font-weight:normal;color:var(--text-light)">（点选，或在下方输入自定义）</span></label>
      <div class="tag-picker" id="status-picker"></div>
      <input type="text" id="status-custom" placeholder="或自定义输入" style="margin-top:8px" oninput="syncStatus(this.value)">
    </div>
    <div class="form-group">
      <label>备注</label>
      <textarea id="item-note" placeholder="随便写..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="item-delete-btn" style="display:none" onclick="deleteCurrentItem()">删除</button>
      <div class="modal-actions-right">
        <button class="btn" onclick="closeModal('modal-item')">取消</button>
        <button class="btn btn-primary" onclick="saveItem()">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="modal-overlay" id="modal-confirm">
  <div class="modal" style="max-width:360px">
    <h3 id="confirm-title">确认</h3>
    <p id="confirm-message" style="color:var(--text-light);font-size:14px;margin-bottom:20px"></p>
    <div class="modal-actions-right" style="justify-content:flex-end">
      <button class="btn" onclick="closeModal('modal-confirm')">取消</button>
      <button class="btn btn-danger" id="confirm-ok">确定</button>
    </div>
  </div>
</div>

<!-- 场地图查看弹窗 -->
<div class="modal-overlay" id="modal-map" style="background:rgba(0,0,0,0.85)">
  <div style="max-width:90vw;max-height:90vh;text-align:center;position:relative">
    <button onclick="closeModal('modal-map')" style="position:absolute;top:-40px;right:0;background:white;border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer">×</button>
    <img id="map-viewer-img" src="" style="max-width:100%;max-height:80vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,0.5)">
    <div id="map-nav" style="display:none;margin-top:12px;gap:12px;justify-content:center;align-items:center">
      <button class="btn" onclick="switchMap(-1)">‹ 上一张</button>
      <span id="map-counter" style="color:white;font-size:14px">1 / 1</span>
      <button class="btn" onclick="switchMap(1)">下一张 ›</button>
    </div>
  </div>
</div>

<input type="file" id="import-input" accept=".json" style="display:none" onchange="handleImportFile(event)">
<input type="file" id="bg-input" accept="image/*" style="display:none" onchange="handleBgUpload(event)">

<!-- 同人本录入弹窗 -->
<div class="modal-overlay" id="modal-book">
  <div class="modal" style="max-width:480px">
    <h3 id="book-modal-title">录入同人本</h3>
    <div class="form-group">
      <label>封面图（拍照或从相册选）</label>
      <div class="image-upload" onclick="document.getElementById('book-image-input').click()">
        点击上传封面
      </div>
      <input type="file" id="book-image-input" accept="image/*" style="display:none" onchange="handleBookImageUpload(event)">
      <div class="image-preview" id="book-image-preview" style="display:none">
        <img id="book-image-preview-img" src="">
        <button class="btn" style="margin-top:8px" onclick="removeBookImage()">移除封面</button>
      </div>
    </div>
    <div class="form-group">
      <label>书名</label>
      <input type="text" id="book-name" placeholder="如 某某同人本">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>作者/社团</label>
        <input type="text" id="book-author" placeholder="作者或社团名">
      </div>
      <div class="form-group">
        <label>IP 分类</label>
        <input type="text" id="book-ip" placeholder="如 咒术回战、初音未来">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>价格（元）</label>
        <input type="number" id="book-price" min="0" step="0.01" placeholder="0">
      </div>
      <div class="form-group">
        <label>购入日期</label>
        <input type="date" id="book-date">
      </div>
    </div>
    <div class="form-group">
      <label>购入方式</label>
      <div class="type-switch">
        <button class="type-btn active" data-purchase="offline" onclick="setPurchaseType('offline')">线下漫展</button>
        <button class="type-btn" data-purchase="online" onclick="setPurchaseType('online')">线上购入</button>
      </div>
    </div>
    <div class="form-group" id="book-event-group">
      <label>购入漫展场次</label>
      <select id="book-event">
        <option value="">选择漫展</option>
      </select>
    </div>
    <div class="form-group" id="book-online-group" style="display:none">
      <div class="form-row">
        <div class="form-group">
          <label>购入平台</label>
          <select id="book-platform" onchange="onPlatformChange()">
            <option value="">选择平台</option>
            <option value="淘宝">淘宝</option>
            <option value="微店">微店</option>
            <option value="闲鱼">闲鱼</option>
            <option value="拼多多">拼多多</option>
            <option value="其他">其他（自行输入）</option>
          </select>
        </div>
        <div class="form-group">
          <label>店铺名</label>
          <input type="text" id="book-shop" placeholder="店铺名">
        </div>
      </div>
      <div class="form-group" id="book-custom-platform-group" style="display:none">
        <label>自定义平台名</label>
        <input type="text" id="book-custom-platform" placeholder="如：煤炉、雅虎、Etsy...">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>邮费（元）</label>
          <input type="number" id="book-shipping" min="0" step="0.01" value="0">
        </div>
        <div class="form-group">
          <label>合计</label>
          <input type="text" id="book-total-display" value="¥0" readonly style="background:var(--gray-light)">
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="book-delete-btn" style="display:none" onclick="deleteCurrentBook()">删除</button>
      <div class="modal-actions-right">
        <button class="btn" onclick="closeModal('modal-book')">取消</button>
        <button class="btn btn-primary" onclick="saveBook()">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- 背景设置弹窗 -->
<div class="modal-overlay" id="modal-bg">
  <div class="modal" style="max-width:420px">
    <h3>背景设置</h3>
    <div class="form-group">
      <label>外观模式</label>
      <div class="seg-group" style="width:100%">
        <button class="seg-btn" id="theme-auto" onclick="setTheme('auto')" style="flex:1">跟随系统</button>
        <button class="seg-btn" id="theme-light" onclick="setTheme('light')" style="flex:1">浅色</button>
        <button class="seg-btn" id="theme-dark" onclick="setTheme('dark')" style="flex:1">深色</button>
      </div>
    </div>
    <div class="form-group">
      <label>交互键/强调色</label>
      <div style="display:flex;align-items:center;gap:12px">
        <input type="color" id="primary-color" value="#007AFF" style="width:50px;height:40px;border:none;border-radius:8px;cursor:pointer;padding:0" oninput="setPrimaryColor(this.value)">
        <span id="primary-color-val" style="font-size:13px;color:var(--text-light)">#007AFF</span>
      </div>
      <div style="font-size:12px;color:var(--text-light);margin-top:4px">自定义按钮、选中状态、链接等的颜色</div>
    </div>
    <div class="form-group">
      <label>推荐配色方案（一键应用）</label>
      <div class="theme-presets">
        <div class="theme-preset" onclick="applyPreset({name:'海洋蓝', primary:'#007AFF', bg:'242,243,245'})">
          <div class="theme-preset-preview" style="background:linear-gradient(135deg, #007AFF 50%, #f2f3f5 50%)"></div>
          <div class="theme-preset-name">海洋蓝</div>
        </div>
        <div class="theme-preset" onclick="applyPreset({name:'薄荷绿', primary:'#34C759', bg:'240,248,244'})">
          <div class="theme-preset-preview" style="background:linear-gradient(135deg, #34C759 50%, #f0f8f4 50%)"></div>
          <div class="theme-preset-name">薄荷绿</div>
        </div>
        <div class="theme-preset" onclick="applyPreset({name:'樱花粉', primary:'#FF6B9D', bg:'252,243,247'})">
          <div class="theme-preset-preview" style="background:linear-gradient(135deg, #FF6B9D 50%, #fcf3f7 50%)"></div>
          <div class="theme-preset-name">樱花粉</div>
        </div>
        <div class="theme-preset" onclick="applyPreset({name:'薰衣草', primary:'#5E5CE6', bg:'244,243,252'})">
          <div class="theme-preset-preview" style="background:linear-gradient(135deg, #5E5CE6 50%, #f4f3fc 50%)"></div>
          <div class="theme-preset-name">薰衣草</div>
        </div>
        <div class="theme-preset" onclick="applyPreset({name:'暖橙', primary:'#FF9500', bg:'252,247,240'})">
          <div class="theme-preset-preview" style="background:linear-gradient(135deg, #FF9500 50%, #fcf7f0 50%)"></div>
          <div class="theme-preset-name">暖橙</div>
        </div>
      </div>
      <div style="font-size:12px;color:var(--text-light);margin-top:4px">点一下就能切换整套配色</div>
    </div>
    <div class="form-group">
      <label>背景遮罩透明度：<span id="bg-opacity-val">75%</span></label>

<script>
// ===== 数据层（DB）=====
const STORAGE_KEY = 'comic_checklist_v1';
let _idSeq = 0;
function genId(prefix) {
  return prefix + '_' + Date.now().toString(36) + '_' + (_idSeq++).toString(36);
}

const DB = {
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (!data.books) data.books = [];
        return data;
      }
    } catch (e) { console.warn('load failed', e); }
    return { events: [], items: [], books: [] };
  },
  save(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  },
  getData() { return this._data || (this._data = this.load()); },
  reset() { this._data = { events: [], items: [], books: [] }; this.save(this._data); },

  getEvents() {
    return [...this.getData().events].sort((a, b) => a.startDate.localeCompare(b.startDate));
  },
  getEventById(id) {
    return this.getData().events.find(e => e.id === id);
  },
  addEvent(event) {
    event.id = event.id || genId('evt');
    event.createdAt = Date.now();
    this.getData().events.push(event);
    this.save(this._data);
    return event;
  },
  updateEvent(id, patch) {
    const ev = this.getEventById(id);
    if (ev) Object.assign(ev, patch);
    this.save(this._data);
    return ev;
  },
  deleteEvent(id) {
    this._data.events = this._data.events.filter(e => e.id !== id);
    this._data.items = this._data.items.filter(i => i.eventId !== id);
    this.save(this._data);
  },

  getItemsByEventId(eventId) {
    return this.getData().items.filter(i => i.eventId === eventId);
  },
  addItem(item) {
    item.id = item.id || genId('item');
    item.createdAt = Date.now();
    this.getData().items.push(item);
    this.save(this._data);
    return item;
  },
  updateItem(id, patch) {
    const it = this.getData().items.find(i => i.id === id);
    if (it) Object.assign(it, patch);
    this.save(this._data);
    return it;
  },
  deleteItem(id) {
    this._data.items = this._data.items.filter(i => i.id !== id);
    this.save(this._data);
  },
  getItemById(id) {
    return this.getData().items.find(i => i.id === id);
  },

  // ===== 同人本收藏 =====
  getBooks() {
    return [...this.getData().books].sort((a, b) => (b.purchaseDate || '').localeCompare(a.purchaseDate || ''));
  },
  addBook(book) {
    book.id = book.id || genId('book');
    book.createdAt = Date.now();
    this.getData().books.push(book);
    this.save(this._data);
    return book;
  },
  updateBook(id, patch) {
    const bk = this.getData().books.find(b => b.id === id);
    if (bk) Object.assign(bk, patch);
    this.save(this._data);
    return bk;
  },
  deleteBook(id) {
    this._data.books = this._data.books.filter(b => b.id !== id);
    this.save(this._data);
  },
  getBookById(id) {
    return this.getData().books.find(b => b.id === id);
  }
};

// ===== 标签预设管理 =====
const TAGS_KEY = 'comic_checklist_v1_tags';
const DEFAULT_TAGS = {
  priority: ['必拿', '想要', '随缘'],
  status: ['清单里', '排队中', '已入手', '卖完了', '放弃'],
  sale: []
};
const TagDB = {
  load() {
    try {
      const raw = localStorage.getItem(TAGS_KEY);
      if (raw) return Object.assign({}, DEFAULT_TAGS, JSON.parse(raw));
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULT_TAGS));
  },
  save(data) { localStorage.setItem(TAGS_KEY, JSON.stringify(data)); },
  get(category) { return this.load()[category] || []; },
  add(category, tag) {
    const all = this.load();
    if (!all[category]) all[category] = [];
    if (!all[category].includes(tag)) all[category].push(tag);
    this.save(all);
  },
  remove(category, tag) {
    const all = this.load();
    all[category] = (all[category] || []).filter(t => t !== tag);
    this.save(all);
  }
};

// 渲染标签选择器
function renderTagPicker(containerId, category, selected, onSelect) {
  const container = document.getElementById(containerId);
  const tags = TagDB.get(category);
  container.innerHTML = '';
  tags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-option' + (tag === selected ? ' active' : '');
    btn.innerHTML = escapeHtml(tag) + ' <span class="tag-del" data-tag="' + escapeHtml(tag) + '">×</span>';
    btn.onclick = (e) => {
      if (e.target.classList.contains('tag-del')) {
        e.stopPropagation();
        showConfirm('删除标签', `确定删除标签「${tag}」吗？已有物品上的这个标签不会被清除。`, () => {
          TagDB.remove(category, tag);
          renderTagPicker(containerId, category, selected, onSelect);
        });
        return;
      }
      onSelect(tag);
    };
    container.appendChild(btn);
  });
  // 添加按钮
  const addBtn = document.createElement('button');
  addBtn.className = 'tag-option tag-add';
  addBtn.textContent = '+ 添加';
  addBtn.onclick = () => {
    const t = prompt('输入新标签名：');
    if (t && t.trim()) {
      TagDB.add(category, t.trim());
      onSelect(t.trim());
      renderTagPicker(containerId, category, t.trim(), onSelect);
    }
  };
  container.appendChild(addBtn);
}

// ===== 工具函数 =====
function getEventStats(eventId) {
  const items = DB.getItemsByEventId(eventId);
  const totalItems = items.length;
  const boughtItems = items.filter(i => i.status === '已入手').length;
  const totalPrice = items.reduce((s, i) => s + (Number(i.price) || 0), 0);
  const spentPrice = items
    .filter(i => i.status === '已入手')
    .reduce((s, i) => s + (Number(i.price) || 0), 0);
  return {
    totalItems, boughtItems, totalPrice, spentPrice,
    remainingPrice: totalPrice - spentPrice
  };
}

function getEventStatus(event) {
  const today = new Date().toISOString().slice(0, 10);
  if (today < event.startDate) {
    const diff = Math.ceil((new Date(event.startDate) - new Date(today)) / 86400000);
    return { type: 'upcoming', label: `还有 ${diff} 天` };
  } else if (today > event.endDate) {
    return { type: 'past', label: '已结束' };
  } else {
    return { type: 'ongoing', label: '进行中' };
  }
}

function priorityWeight(p) {
  if (p === '必拿') return 0;
  if (p === '想要') return 1;
  if (p === '随缘') return 2;
  return 3;
}

function sortItems(items, sortBy) {
  const arr = [...items];
  if (sortBy === 'venue') {
    arr.sort((a, b) => {
      const va = (a.venue || '').localeCompare(b.venue || '');
      if (va !== 0) return va;
      return (a.booth || '').localeCompare(b.booth || '');
    });
  } else if (sortBy === 'priority') {
    arr.sort((a, b) => priorityWeight(a.priority) - priorityWeight(b.priority));
  } else if (sortBy === 'created') {
    arr.sort((a, b) => b.createdAt - a.createdAt);
  }
  return arr;
}

// ===== 状态 =====
let currentEventId = null;
let currentItemId = null;
let currentItemType = 'goods';
let currentPriority = '';
let currentStatus = '清单里';
let currentSale = '';
let currentImageData = '';
let currentMapImages = [];
let currentMapIndex = 0;
let typeFilter = 'all';

// ===== 视图切换 =====
function goHome() {
  currentEventId = null;
  document.getElementById('view-list').classList.remove('active');
  document.getElementById('view-home').classList.add('active');
  renderHome();
}

// ===== 渲染首页 =====
// ===== 年历 =====
let calYear, calMonth;

// 日历滑动切换月份
let touchStartX = 0;
let touchStartY = 0;
document.addEventListener('DOMContentLoaded', () => {
  const calCard = document.getElementById('calendar-card');
  if (calCard) {
    calCard.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    calCard.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      // 水平滑动距离大于垂直，且超过 50px 才算
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        if (dx < 0) changeMonth(1); // 左滑 → 下个月
        else changeMonth(-1);       // 右滑 → 上个月
      }
    }, { passive: true });
  }
});

function initCalendar() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth(); // 0-11
}

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}

function renderCalendar() {
  if (calYear === undefined) initCalendar();
  document.getElementById('calendar-title').textContent = `${calYear}年${calMonth + 1}月`;

  // 把所有漫展的日期映射成 { "2026-12-30": [eventId] }
  const eventDays = {};
  DB.getEvents().forEach(ev => {
    const start = new Date(ev.startDate);
    const end = new Date(ev.endDate);
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const key = d.toISOString().slice(0, 10);
      if (!eventDays[key]) eventDays[key] = [];
      eventDays[key].push(ev.id);
    }
  });

  const grid = document.getElementById('calendar-grid');
  grid.innerHTML = '';

  // 星期标题
  ['日', '一', '二', '三', '四', '五', '六'].forEach(w => {
    const el = document.createElement('div');
    el.className = 'cal-weekday';
    el.textContent = w;
    grid.appendChild(el);
  });

  const firstDay = new Date(calYear, calMonth, 1).getDay(); // 0=周日
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();
  const todayStr = new Date().toISOString().slice(0, 10);

  // 前面补上个月的日期
  for (let i = firstDay - 1; i >= 0; i--) {
    const el = document.createElement('div');
    el.className = 'cal-day other-month';
    el.textContent = daysInPrev - i;
    grid.appendChild(el);
  }

  // 本月日期
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const el = document.createElement('div');
    el.className = 'cal-day';
    el.textContent = d;
    if (dateStr === todayStr) el.classList.add('today');
    if (eventDays[dateStr]) {
      el.classList.add('has-event');
      el.title = DB.getEventById(eventDays[dateStr][0]).name;
      el.onclick = () => openList(eventDays[dateStr][0]);
    }
    grid.appendChild(el);
  }

  // 后面补下个月的日期，凑满 7 的倍数
  const totalCells = firstDay + daysInMonth;
  const remaining = (7 - totalCells % 7) % 7;
  for (let i = 1; i <= remaining; i++) {
    const el = document.createElement('div');
    el.className = 'cal-day other-month';
    el.textContent = i;
    grid.appendChild(el);
  }
}

// ===== 视图切换 =====
function showView(viewName) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + viewName).classList.add('active');
  window.scrollTo(0, 0);
  if (viewName === 'home') renderHome();
  if (viewName === 'shelf') renderShelf();
}

// ===== 同人本收藏 =====
let currentBookId = null;
let currentBookImage = '';
let currentPurchaseType = 'offline';
let currentShelfIp = ''; // 空字符串 = 全部

function setShelfIp(ip) {
  currentShelfIp = ip;
  renderShelf();
}

function renderShelf() {
  let books = DB.getBooks();
  const gridEl = document.getElementById('shelf-grid');
  const emptyEl = document.getElementById('shelf-empty');
  const statsEl = document.getElementById('shelf-stats');
  const ipListEl = document.getElementById('shelf-ip-list');

  // 提取所有 IP 去重
  const ipSet = {};
  books.forEach(b => {
    if (b.ip) ipSet[b.ip] = (ipSet[b.ip] || 0) + 1;
  });

  // 渲染 IP 标签
  ipListEl.innerHTML = '';
  const allTag = document.createElement('div');
  allTag.className = 'shelf-ip-tag' + (currentShelfIp === '' ? ' active' : '');
  allTag.onclick = () => setShelfIp('');
  allTag.innerHTML = '全部 <span class="shelf-ip-count">' + books.length + '</span>';
  ipListEl.appendChild(allTag);
  Object.keys(ipSet).sort().forEach(ip => {
    const tag = document.createElement('div');
    tag.className = 'shelf-ip-tag' + (currentShelfIp === ip ? ' active' : '');
    tag.onclick = () => setShelfIp(ip);
    tag.innerHTML = escapeHtml(ip) + ' <span class="shelf-ip-count">' + ipSet[ip] + '</span>';
    ipListEl.appendChild(tag);
  });

  // 按当前 IP 筛选
  if (currentShelfIp) {
    books = books.filter(b => b.ip === currentShelfIp);
  }

  gridEl.innerHTML = '';
  if (books.length === 0) {
    emptyEl.style.display = 'block';
    statsEl.innerHTML = '';
    return;
  }
  emptyEl.style.display = 'none';
  const totalSpent = books.reduce((s, b) => s + Number(b.price || 0) + Number(b.shippingFee || 0), 0);
  const offlineCount = books.filter(b => b.purchaseType === 'offline').length;
  const onlineCount = books.filter(b => b.purchaseType === 'online').length;
  statsEl.innerHTML =
    '<div class="stat-item"><strong>' + books.length + '</strong> 本收藏</div>' +
    '<div class="stat-item"><strong>¥' + totalSpent.toFixed(0) + '</strong> 总花费</div>' +
    '<div class="stat-item"><strong>' + offlineCount + '</strong> 线下购入</div>' +
    '<div class="stat-item"><strong>' + onlineCount + '</strong> 线上通贩</div>';

  books.forEach(bk => {
    const card = document.createElement('div');
    card.className = 'book-card';
    card.onclick = () => openBookModal(bk.id);
    let meta = bk.author || '';
    if (bk.ip) meta = '[' + bk.ip + '] ' + meta;
    if (bk.purchaseType === 'offline' && bk.eventId) {
      const ev = DB.getEventById(bk.eventId);
      if (ev) meta += ' · ' + ev.name;
    } else if (bk.purchaseType === 'online') {
      meta += ' · ' + (bk.platform || '') + (bk.shop ? ' ' + bk.shop : '');
    }
    if (bk.purchaseDate) meta += ' · ' + bk.purchaseDate;
    const coverHtml = bk.image
      ? '<img src="' + bk.image + '">'
      : '📖';
    const totalPrice = Number(bk.price || 0) + Number(bk.shippingFee || 0);
    card.innerHTML =
      '<div class="book-card-cover">' + coverHtml + '</div>' +
      '<div class="book-card-name">' + escapeHtml(bk.name) + '</div>' +
      '<div class="book-card-meta">' + escapeHtml(meta) + '</div>' +
      '<div class="book-card-price">¥' + totalPrice.toFixed(0) + '</div>';
    gridEl.appendChild(card);
  });
}

function openBookModal(editId) {
  currentBookId = editId || null;
  const bk = editId ? DB.getBookById(editId) : null;
  document.getElementById('book-modal-title').textContent = bk ? '编辑同人本' : '录入同人本';
  document.getElementById('book-name').value = bk ? bk.name : '';
  document.getElementById('book-author').value = bk ? (bk.author || '') : '';
  document.getElementById('book-ip').value = bk ? (bk.ip || '') : '';
  document.getElementById('book-price').value = bk ? bk.price : '';
  document.getElementById('book-date').value = bk ? (bk.purchaseDate || '') : new Date().toISOString().slice(0, 10);
  document.getElementById('book-shop').value = bk ? (bk.shop || '') : '';
  document.getElementById('book-shipping').value = bk ? (bk.shippingFee || 0) : 0;
  document.getElementById('book-custom-platform').value = bk ? (bk.customPlatform || '') : '';
  document.getElementById('book-delete-btn').style.display = bk ? 'block' : 'none';
  currentBookImage = bk ? (bk.image || '') : '';
  currentPurchaseType = bk ? (bk.purchaseType || 'offline') : 'offline';
  setPurchaseType(currentPurchaseType, true);
  onPlatformChange();

  // 填充漫展下拉
  const eventSel = document.getElementById('book-event');
  eventSel.innerHTML = '<option value="">选择漫展</option>';
  DB.getEvents().forEach(ev => {
    const opt = document.createElement('option');
    opt.value = ev.id;
    opt.textContent = ev.name;
    if (bk && bk.eventId === ev.id) opt.selected = true;
    eventSel.appendChild(opt);
  });
  if (bk && bk.platform) {
    document.getElementById('book-platform').value = bk.platform;
    onPlatformChange();
  }
  updateBookTotal();

  updateBookImagePreview();
  document.getElementById('modal-book').classList.add('active');
}

function setPurchaseType(t, silent) {
  currentPurchaseType = t;
  document.querySelectorAll('#modal-book .type-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.purchase === t);
  });
  document.getElementById('book-event-group').style.display = t === 'offline' ? 'block' : 'none';
  document.getElementById('book-online-group').style.display = t === 'online' ? 'block' : 'none';
  updateBookTotal();
}

function onPlatformChange() {
  const platform = document.getElementById('book-platform').value;
  document.getElementById('book-custom-platform-group').style.display = platform === '其他' ? 'block' : 'none';
}

function updateBookTotal() {
  const price = Number(document.getElementById('book-price').value) || 0;
  const shipping = Number(document.getElementById('book-shipping').value) || 0;
  document.getElementById('book-total-display').value = '¥' + (price + shipping).toFixed(0);
}

function handleBookImageUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  compressImage(file, 400, 0.8).then(dataUrl => {
    currentBookImage = dataUrl;
    updateBookImagePreview();
  });
  e.target.value = '';
}

function updateBookImagePreview() {
  const preview = document.getElementById('book-image-preview');
  const upload = document.querySelector('#book-image-input');
  if (currentBookImage) {
    document.getElementById('book-image-preview-img').src = currentBookImage;
    preview.style.display = 'block';
    upload.parentElement.style.display = 'none';
  } else {
    preview.style.display = 'none';
    upload.parentElement.style.display = 'block';
  }
}

function removeBookImage() {
  currentBookImage = '';
  updateBookImagePreview();
}

function saveBook() {
  const name = document.getElementById('book-name').value.trim();
  if (!name) { alert('请填写书名'); return; }
  const data = {
    name,
    author: document.getElementById('book-author').value.trim(),
    ip: document.getElementById('book-ip').value.trim(),
    price: Number(document.getElementById('book-price').value) || 0,
    purchaseDate: document.getElementById('book-date').value,
    purchaseType: currentPurchaseType,
    image: currentBookImage
  };
  if (currentPurchaseType === 'offline') {
    data.eventId = document.getElementById('book-event').value;
  } else {
    const platform = document.getElementById('book-platform').value;
    data.platform = platform === '其他' ? document.getElementById('book-custom-platform').value.trim() : platform;
    data.shop = document.getElementById('book-shop').value.trim();
    data.shippingFee = Number(document.getElementById('book-shipping').value) || 0;
  }
  if (currentBookId) {
    DB.updateBook(currentBookId, data);
  } else {
    DB.addBook(data);
  }
  closeModal('modal-book');
  renderShelf();
}

function deleteCurrentBook() {
  if (!currentBookId) return;
  showConfirm('删除同人本', '确定要删除这本同人本的记录吗？', () => {
    DB.deleteBook(currentBookId);
    closeModal('modal-book');
    renderShelf();
  });
}

function renderHome() {
  renderShelf();
  renderCalendar();
  const events = DB.getEvents();
  const listEl = document.getElementById('event-list');
  const emptyEl = document.getElementById('empty-state');
  listEl.innerHTML = '';

  if (events.length === 0) {
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  events.forEach(ev => {
    const stats = getEventStats(ev.id);
    const status = getEventStatus(ev);
    const pct = stats.totalItems > 0 ? (stats.boughtItems / stats.totalItems * 100) : 0;

    const card = document.createElement('div');
    card.className = 'event-card';
    card.onclick = () => openList(ev.id);
    card.innerHTML = `
      <div class="event-card-top">
        <span class="event-name">${escapeHtml(ev.name)}</span>
        <span class="tag tag-${status.type}">${status.label}</span>
      </div>
      <div class="event-meta">
        <span>📅 ${ev.startDate} ~ ${ev.endDate}</span>
        <span>📍 ${escapeHtml(ev.location || '未填地点')}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="event-stats">
        已入手 <strong>${stats.boughtItems}</strong> / ${stats.totalItems} 件 ｜
        已花 <strong>¥${stats.spentPrice.toFixed(0)}</strong> / 预计 ¥${stats.totalPrice.toFixed(0)}
      </div>
    `;
    listEl.appendChild(card);
  });
}

function openList(eventId) {
  currentEventId = eventId;
  const ev = DB.getEventById(eventId);
  document.getElementById('list-title').textContent = ev.name;

// 饼图配色
const CHART_COLORS = ['#c084fc', '#60a5fa', '#34d399', '#fbbf24', '#f87171', '#a78bfa', '#2dd4bf', '#fb923c', '#f472b6', '#94a3b8'];

function renderChart(totalSpent) {
  const chartBar = document.getElementById('chart-bar');
  const pieEl = document.getElementById('pie-chart');
  const legendEl = document.getElementById('chart-legend');

  if (!currentEventId || totalSpent <= 0) {
    chartBar.style.display = 'none';
    return;
  }
  chartBar.style.display = 'block';

  // 按 IP 分组已入手的花费
  const groups = {};
  DB.getItemsByEventId(currentEventId)
    .filter(i => i.status === '已入手')
    .forEach(i => {
      const key = i.ip || '未分类';
      groups[key] = (groups[key] || 0) + (Number(i.price) || 0);
    });

  const entries = Object.entries(groups).sort((a, b) => b[1] - a[1]);
  if (entries.length === 0) {
    chartBar.style.display = 'none';
    return;
  }

  // 画饼图（conic-gradient）
  let acc = 0;
  const gradientParts = entries.map(([name, val], idx) => {
    const pct = (val / totalSpent) * 100;
    const start = acc;
    acc += pct;
    const color = CHART_COLORS[idx % CHART_COLORS.length];
    return `${color} ${start}% ${acc}%`;
  });
  pieEl.style.background = `conic-gradient(${gradientParts.join(', ')})`;

  // 画图例
  legendEl.innerHTML = entries.map(([name, val], idx) => {
    const pct = ((val / totalSpent) * 100).toFixed(1);
    const color = CHART_COLORS[idx % CHART_COLORS.length];
    return `
      <div class="legend-item">
        <span class="legend-dot" style="background:${color}"></span>
        <span class="legend-name">${escapeHtml(name)}</span>
        <span class="legend-value">¥${val.toFixed(0)} (${pct}%)</span>
      </div>
    `;
  }).join('');
}

// 物品列表标签页切换
let currentItemTab = 'remaining';
function setItemTab(tab) {
  currentItemTab = tab;

function renderItems() {
  if (!currentEventId) return;
  const keyword = document.getElementById('search-input').value.trim().toLowerCase();
  const sortBy = document.getElementById('sort-select').value;
  let items = DB.getItemsByEventId(currentEventId);

  if (typeFilter !== 'all') items = items.filter(i => i.type === typeFilter);
  if (keyword) items = items.filter(i => i.name.toLowerCase().includes(keyword));
  items = sortItems(items, sortBy);

  const listEl = document.getElementById('item-list');
  const emptyEl = document.getElementById('item-empty');
  listEl.innerHTML = '';

  // 分成两栏：待买（未入手） / 已买（已入手）
  const remaining = items.filter(i => i.status !== '已入手');
  const bought = items.filter(i => i.status === '已入手');

  if (items.length === 0) {
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  // 切换按钮
  const tabBar = document.createElement('div');
  tabBar.className = 'item-tab-bar';
  tabBar.innerHTML = `
    <button class="item-tab ${currentItemTab === 'remaining' ? 'active' : ''}" onclick="setItemTab('remaining')">🛒 待买 ${remaining.length}</button>
    <button class="item-tab ${currentItemTab === 'bought' ? 'active' : ''}" onclick="setItemTab('bought')">✅ 已买 ${bought.length}</button>
  `;
  listEl.appendChild(tabBar);

  // 只显示当前标签页的那一栏
  if (currentItemTab === 'remaining') {
    const col = document.createElement('div');
    col.className = 'item-column';
    const cards = document.createElement('div');
    cards.className = 'cards';
    remaining.forEach(it => cards.appendChild(buildItemCard(it)));
    if (remaining.length === 0) cards.innerHTML = '<div style="color:var(--text-light);font-size:13px;padding:20px;text-align:center">全部买完啦 🎉</div>';
    col.appendChild(cards);
    listEl.appendChild(col);
  } else {
    const col = document.createElement('div');
    col.className = 'item-column done';
    const cards = document.createElement('div');
    cards.className = 'cards';
    bought.forEach(it => cards.appendChild(buildItemCard(it)));
    if (bought.length === 0) cards.innerHTML = '<div style="color:var(--text-light);font-size:13px;padding:20px;text-align:center">还没买东西</div>';
    col.appendChild(cards);
    listEl.appendChild(col);
  }
}

function buildItemCard(it) {
  const statusClass = getStatusClass(it.status);
  const card = document.createElement('div');
  card.className = 'item-card';
  card.onclick = () => openItemModal(it.id);
  card.innerHTML = `
    <div class="item-thumb">
      ${it.image ? `<img src="${it.image}">` : '🎁'}
    </div>
    <div class="item-main">
      <div class="item-name">
        <span class="tag ${it.type === 'book' ? 'tag-type-book' : it.type === 'free' ? 'tag-type-free' : 'tag-type-goods'}">${it.type === 'book' ? '本' : it.type === 'free' ? '无料' : '谷'}</span>
        ${escapeHtml(it.name)}
      </div>
      <div class="item-meta">
        ${it.ip ? `<span class="tag tag-ip">${escapeHtml(it.ip)}</span> ` : ''}
        ${it.venue ? `🏟️ ${escapeHtml(it.venue)}` : ''}${it.booth ? ` · ${escapeHtml(it.booth)}` : ''}
        ${it.mihan ? ` ｜ ${escapeHtml(it.mihan)}` : ''}
      </div>
    </div>
    <div class="item-right">
      <div class="item-price">${it.type === 'free' ? '无料' : '¥' + Number(it.price || 0).toFixed(0)}</div>
      <div class="item-tags">
        ${it.priority ? `<span class="tag tag-priority">${escapeHtml(it.priority)}</span>` : ''}

function getStatusClass(status) {
  if (status === '已入手') return 'tag-status-bought';
  if (status === '排队中') return 'tag-status-queue';
  if (status === '卖完了') return 'tag-status-soldout';
  if (status === '放弃') return 'tag-status-drop';

}

function compressImage(file, maxW, quality) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxW) { h = h * maxW / w; w = maxW; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

const THEME_KEY = 'comic_checklist_theme';

  document.documentElement.style.setProperty('--primary-light', 'rgba(' + r + ',' + g + ',' + b + ', 0.1)');

  e.target.value = '';
}

// ===== 公共 =====
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// 点击遮罩关闭弹窗
document.querySelectorAll('.modal-overlay').forEach(ov => {
  ov.addEventListener('click', e => {
    if (e.target === ov) ov.classList.remove('active');
  });
});

// 初始化
loadBgTint();
applyPrimaryColor(getPrimaryColor());
applyTheme();
loadBg();
renderHome();
</script>
</body>
</html>
